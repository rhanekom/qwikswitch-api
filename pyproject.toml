[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwikswitch_api"
version = "0.0.11"
authors = [
  { name="Riaan Hanekom", email="riaan@hanekom.io" },
]
description = "A Python wrapper around the QwikSwitch API"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
]

# Development-only dependencies (not shipped in the published wheel). These live in
# dependency-groups rather than optional-dependencies so they stay out of package
# metadata; `uv sync` installs the `dev` group by default.
[dependency-groups]
test = ["pytest", "pytest-cov", "requests-mock", "pytest-flakes"]
docs = ["sphinx", "pydata-sphinx-theme"]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "build",
    "twine",
    "ruff",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["qwikswitchapi"]
